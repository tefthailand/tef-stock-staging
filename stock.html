<!DOCTYPE html>
<html lang="th">
<head>
<title>รายการพัสดุ — TEF</title>

<script src="assets/config.js"></script>

<style>
:root{
--tef-navy:#0A2342; --tef-navy-deep:#061A33; --tef-ocean:#1B7FA8; --tef-ocean-text:#176887;
--tef-ocean-light:#EAF6FC; --tef-bg:#F2F8FC; --tef-card:#FFFFFF; --tef-text:#0E2033;
--tef-text-soft:#50677D; --tef-border:#CFE2EF; --tef-good:#1A7F5A; --tef-warn:#946202; --tef-danger:#B3341F;
--tef-font:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
--tef-font-head:"Kanit","IBM Plex Sans Thai",sans-serif;
--tef-radius:10px; --tef-maxwidth:1120px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--tef-bg);color:var(--tef-text);font-family:var(--tef-font);font-size:15px}
.tef-header{background:linear-gradient(160deg,var(--tef-navy-deep) 0%,var(--tef-navy) 60%,#123A63 100%);color:#EAF6FC;padding:22px 16px 18px;border-bottom:3px solid var(--tef-ocean)}
.tef-header .inner{max-width:var(--tef-maxwidth);margin:0 auto}
.tef-header .org{font-size:16px;letter-spacing:.02em;color:#fff;font-weight:600;margin-bottom:6px}
.tef-header h1{font-family:var(--tef-font-head);font-weight:600;font-size:clamp(20px,4vw,27px);margin:0;color:#fff}
.tef-header p{color:#A8CFE4;font-size:12.5px;margin:5px 0 0}
.wrap{max-width:var(--tef-maxwidth);margin:0 auto;padding:0 16px 110px}
.sbar{position:sticky;top:0;z-index:20;background:var(--tef-bg);padding:14px 0 8px}
.sbox{display:flex;gap:8px}
.sbox input{flex:1;min-width:0;border:1px solid var(--tef-border);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;background:#fff}
.sbox input:focus{outline:2px solid var(--tef-ocean);border-color:var(--tef-ocean)}
.sbox button{border:1px solid var(--tef-border);background:#fff;border-radius:10px;padding:0 14px;font:inherit;color:var(--tef-text-soft);cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--tef-border);background:#fff;color:var(--tef-text);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--tef-text-soft);margin-left:4px}
.chip.on{background:var(--tef-navy);border-color:var(--tef-navy);color:#fff}
.chip.on small{color:#B7D3E8}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px;color:var(--tef-text-soft);padding:6px 0}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts select{border:1px solid var(--tef-border);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;background:#fff}
.note{background:#FFF8E5;border:1px solid #EBD38B;border-radius:8px;padding:10px 13px;font-size:13px;margin:8px 0;color:#5b4300}
.cnt{font-size:13px;color:var(--tef-text-soft);margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sec{grid-column:1/-1;font-weight:700;font-size:15px;color:var(--tef-navy);padding:10px 2px 2px;border-bottom:2px solid var(--tef-border)}
.sec small{font-weight:400;color:var(--tef-text-soft);margin-left:6px}
.card{background:var(--tef-card);border:1px solid var(--tef-border);border-radius:var(--tef-radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative}
.card:hover{border-color:var(--tef-ocean);box-shadow:0 2px 10px rgba(10,35,66,.1)}
.card.zero{opacity:.62}
.ph{aspect-ratio:1/1;background:var(--tef-ocean-light);display:flex;align-items:center;justify-content:center;color:#8FB8CF;overflow:hidden}
.ph.nop{aspect-ratio:16/7}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph svg{width:40px;height:40px}
.bd{position:absolute;top:8px;right:8px;background:var(--tef-good);color:#fff;border-radius:999px;font-size:12px;font-weight:600;padding:3px 10px}
.bd.zero{background:var(--tef-danger)}
.bd.low{background:var(--tef-warn)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.cn{font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cs{font-size:12px;color:var(--tef-text-soft)}
.sz{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.sz span{font-size:11.5px;background:var(--tef-ocean-light);color:var(--tef-ocean-text);border-radius:6px;padding:2px 6px}
.sz span.z{background:#F3E4E1;color:var(--tef-danger)}
.btn{border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:500;cursor:pointer;background:var(--tef-navy);color:#fff}
.btn:hover{background:var(--tef-ocean)}
.btn.ghost{background:#fff;color:var(--tef-ocean-text);border:1px solid var(--tef-border)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.more{text-align:center;margin:18px 0}
.empty{text-align:center;color:var(--tef-text-soft);padding:40px 10px}
.bask{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--tef-ocean);padding:10px 16px;display:none;z-index:30;box-shadow:0 -4px 14px rgba(10,35,66,.12)}
.bask .in{max-width:var(--tef-maxwidth);margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bask .t{flex:1;min-width:150px;font-size:14px}
.bask a.btn{text-decoration:none;display:inline-block}
.mod{position:fixed;inset:0;background:rgba(6,26,51,.55);z-index:40;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px}
.mod .box{background:#fff;border-radius:14px;max-width:760px;width:100%;overflow:hidden}
.mod .top{display:flex;gap:16px;padding:18px;flex-wrap:wrap}
.mod .pic{width:min(100%,300px);flex:none}
.mod .big{aspect-ratio:1/1;max-height:300px;background:var(--tef-ocean-light);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8FB8CF}
.mod .big img{width:100%;height:100%;object-fit:contain;background:#fff}
.mod .th{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mod .th img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer}
.mod .th img.on{border-color:var(--tef-ocean)}
.mod .inf{flex:1;min-width:220px}
.mod h2{font-family:var(--tef-font-head);font-weight:600;font-size:18px;margin:0 0 6px;line-height:1.35}
.kv{font-size:13px;color:var(--tef-text-soft);margin:2px 0}
.kv b{color:var(--tef-text);font-weight:500}
.vt{width:100%;border-collapse:collapse;font-size:14px;margin:0}
.vt th{background:var(--tef-navy);color:#DCEEF8;font-size:11.5px;font-weight:500;padding:8px 10px;text-align:left}
.vt td{padding:8px 10px;border-top:1px solid var(--tef-border);vertical-align:middle}
.vt td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.vt .q{display:inline-flex;align-items:center;border:1px solid var(--tef-border);border-radius:8px;overflow:hidden}
.vt .q button{border:0;background:#fff;width:28px;height:30px;font-size:16px;cursor:pointer}
.vt .q span{min-width:28px;text-align:center;font-weight:600}
.vt .z{color:var(--tef-danger)}
.mod .foot{padding:12px 18px 18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.adm{background:#fff;border:1px dashed var(--tef-ocean);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:13px}
.adm summary{cursor:pointer;font-weight:600;color:var(--tef-ocean-text)}
.adm .bar{height:8px;background:var(--tef-ocean-light);border-radius:5px;overflow:hidden;margin:8px 0}
.adm .bar i{display:block;height:100%;width:0;background:var(--tef-ocean)}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.cb{padding:8px 9px 10px}.cn{font-size:13px}.mod{padding:0}.mod .box{border-radius:0;min-height:100vh}}

/* ═══ หน้าตาแบบร้านค้า: การ์ด 3 คอลัมน์ รูปใหญ่พื้นเทา ปุ่มทรงแคปซูล ═══ */
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 26px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 16px}}
.card{background:transparent;border:0;border-radius:0;overflow:visible}
.card:hover{border-color:transparent;box-shadow:none}
.card:hover .ph{box-shadow:0 6px 18px rgba(10,35,66,.12)}
.card.zero{opacity:.55}
.ph,.ph.nop{aspect-ratio:4/3;background:#E7EAEE;border-radius:16px;color:#9AA7B4;transition:box-shadow .15s}
.ph img{object-fit:contain;padding:6%;background:#E7EAEE}
.bd{top:10px;right:10px}
.cb{padding:12px 4px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:3px;align-items:center}
.cb>*{grid-column:1}
.cn{font-size:15px;font-weight:700;color:#111827;-webkit-line-clamp:2}
.cq{font-size:14px;font-weight:700;color:#111827}
.cs{font-size:12px;color:#8A94A3}
.add{grid-column:2;grid-row:1 / span 3;border:0;border-radius:999px;padding:8px 16px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;background:#2AA8E0;color:#fff;white-space:nowrap}
.add:hover{background:#1B8FC4}
.add.dk{background:#1F2933}
.add.dk:hover{background:#000}
.sbox{position:relative}
.cart{flex:none;position:relative;border:0;background:transparent;cursor:pointer;padding:6px 8px;color:#111827}
.cart svg{width:28px;height:28px;display:block}
.cart b{position:absolute;top:0;right:0;min-width:18px;height:18px;border-radius:999px;background:#2AA8E0;color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 4px;display:none}
@media (max-width:520px){.cb{grid-template-columns:1fr}.add{grid-column:1;grid-row:auto;justify-self:start;margin-top:4px}}
</style>
</head>

</div></div>
<div class="wrap">

</div>

<script>
var D = { items: [], app: '', admin: false };
var ALL = [];          // รายการแบบรวมกลุ่มไซส์
var CAT = 'ทั้งหมด';
var SHOWN = 0, PAGE = 48, CUR = [];
var PH = {};           // code -> dataURL ภาพย่อ
var ASKED = {};
var BASK = {};         // code -> {q, n, b} · v35: จำไว้ใน sessionStorage tef_cart (รีเฟรช/ย้อนกลับไม่หาย · แยกตามเครื่องและแท็บ)
var CART_KEY = 'tef_cart';
function cartSave(){ try { if (Object.keys(BASK).length) sessionStorage.setItem(CART_KEY, JSON.stringify(BASK)); else sessionStorage.removeItem(CART_KEY); } catch (e) {} }
/* คืนตะกร้าหลังโหลดรายการ: ตัดรายการที่ไม่มีแล้วหรือหมด และไม่ให้เกินคงเหลือล่าสุด */
function cartRestore(){
var saved = null; try { saved = JSON.parse(sessionStorage.getItem(CART_KEY) || 'null'); } catch (e) {}
if (!saved || typeof saved !== 'object') return;
var byCode = {}; (D.items || []).forEach(function (it) { byCode[it.c] = it; });
Object.keys(saved).forEach(function (code) {
var it = byCode[code], q = Math.floor(Number((saved[code] || {}).q) || 0);

BASK[code] = { q: Math.min(q, it.b), n: it.n, b: it.b };
});
}
var $ = function (i) { return document.getElementById(i); };
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>';
window.addEventListener('DOMContentLoaded', function () {
google.script.run.withSuccessHandler(onList).withFailureHandler(fail).stockList();
$('q').addEventListener('input', function(){ render(true); });
$('qx').addEventListener('click', function(){ $('q').value=''; render(true); $('q').focus(); });
$('onlyStock').addEventListener('change', function(){ render(true); });
$('sort').addEventListener('change', function(){ render(true); });

$('baskClr').addEventListener('click', function(){ BASK = {}; baskUi(); if ($('mod').style.display === 'flex') closeMod(); });
$('mod').addEventListener('click', function(e){ if (e.target === $('mod')) closeMod(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeMod(); });
});
function fail(e){ $('cnt').textContent = 'โหลดรายการไม่สำเร็จ: ' + (e && e.message ? e.message : e); }
function onList(d){
D = d || D;
var map = {};
(D.items || []).forEach(function (it) {
var sp = splitName(it.n);
it.base = sp.base; it.sz = sp.size;
it.key = it.sz ? it.m + '|' + sp.base.replace(/\s+/g, '').toLowerCase() : '';
if (it.key) { (map[it.key] = map[it.key] || []).push(it); }
});
ALL = [];
var done = {};
(D.items || []).forEach(function (it) {
var key = it.key;
var grp = key ? map[key] : null;
if (grp && grp.length > 1) {
if (done[key]) return; done[key] = 1;
grp.sort(function (a, b) { return szRank(a.sz) - szRank(b.sz) || (a.sz < b.sz ? -1 : 1); });
ALL.push(mk(grp[0].base, grp));
} else { ALL.push(mk(it.n, [it])); }
});
cartRestore();
buildChips(); buildAdmin(); render(true);
baskUi();
}
function mk(name, arr){
var tot = 0, ph = ''; arr.forEach(function (x) { tot += x.b; if (!ph && x.p > 0) ph = x.c; });
var hay = '';
arr.forEach(function (x) { hay += ' ' + x.n + ' ' + (x.e || '') + ' ' + x.c + ' ' + x.s + ' ' + x.z + ' ' + x.l + ' ' + (x.sk || ''); });
hay += ' ' + arr[0].m;
return { name: name, items: arr, cat: arr[0].m, sub: arr[0].s, bal: tot, ph: ph, code: arr[0].c,
hay: norm(hay), grp: arr.length > 1, typ: typeOf(arr[0]), sku: skuModel(arr[0]), rad: arr.length === 1 ? arr[0].r : null, year: arr[0].y || ((/\b(19|20)\d\d\b/.exec(name) || [''])[0]) };
}
/* รหัสรุ่น = รหัสสินค้าตัดไซส์ท้ายออก เช่น PCC-23Y-M → PCC-23Y */
function skuModel(it){ var k = it.sk || ''; return it.sz && k.slice(-(it.sz.length + 1)) === '-' + it.sz ? k.slice(0, -(it.sz.length + 1)) : (it.x && k.slice(-(String(it.x).length + 1)) === '-' + it.x ? k.slice(0, -(String(it.x).length + 1)) : k); }
/* ประเภทสำหรับแบ่งกลุ่ม: เครื่องแต่งกายใช้คอลัมน์ทรง ที่เหลือใช้หมวดหมู่ */
function typeOf(it){
if (it.m !== 'เครื่องแต่งกาย') return it.s || it.m || 'อื่นๆ';
var t = it.t || '', n = String(it.n || '').toLowerCase();
if (t === 'โปโล' || /\bpolo\b/.test(n) && !/t-shirt/.test(n)) return 'เสื้อโปโล';
if (t === 'เสื้อยืด' || /t-shirt|เสื้อยืด/.test(n)) return 'เสื้อยืด';
if (t === 'หมวก' || /\bcap\b|หมวก/.test(n)) return 'หมวก';
if (t === 'ปลอกแขน' || /armband|ปลอกแขน/.test(n)) return 'ปลอกแขน';
if (t === 'เสื้อกั๊ก' || /vest|reflective|สะท้อนแสง/.test(n)) return 'เสื้อกั๊ก / สะท้อนแสง';
return 'เสื้ออื่นๆ';
}
var SZ1 = /\s+(?:size|ไซส์|ไซซ์)\s*[:\-]?\s*([A-Za-z0-9.\/\-]+)\s*$/i;
var SZ2 = /\s+(XXS|XS|SS|S|M|L|XL|XXL|2XL|3XL|4XL|5XL|2X)\s*$/i;
function splitName(n){
var m = SZ1.exec(n); if (m) return { base: n.slice(0, m.index), size: m[1].toUpperCase() };
m = SZ2.exec(n); if (m) return { base: n.slice(0, m.index), size: m[1].toUpperCase() };
return { base: n, size: '' };
}
var ORDER = ['XXS','XS','SS','S','M','L','XL','XXL','2X','2XL','3XL','4XL','5XL'];
function szRank(s){ var i = ORDER.indexOf(s); if (i >= 0) return i; var n = parseFloat(s); return isNaN(n) ? 99 : 100 + n; }
function norm(s){ return String(s || '').toLowerCase().replace(/[\u2018\u2019\u02bc\u0060]/g, "'").replace(/\s+/g, ' '); }
var SYN = {
'pcc': ["princess's cup","princess cup","princess","ปรินเซส","pcc"],
'เจ้าหญิง': ["princess","เจ้าหญิง"],
'polo': ['polo','โปโล'], 'โปโล': ['polo','โปโล'],
'กรม': ['กรม','navy'], 'navy': ['กรม','navy'],
'ส้ม': ['ส้ม','orange'], 'orange': ['ส้ม','orange'],
'เหลือง': ['เหลือง','yellow'], 'yellow': ['เหลือง','yellow'],
'ฟ้า': ['ฟ้า','light blue','sky'], 'ขาว': ['ขาว','white'], 'ดำ': ['ดำ','black'], 'แดง': ['แดง','red'],
'เขียว': ['เขียว','green'], 'ม่วง': ['ม่วง','purple'], 'ชมพู': ['ชมพู','pink'], 'น้ำเงิน': ['น้ำเงิน','blue'],

$('admBox').innerHTML = '<details class="adm"><summary>สำหรับผู้ดูแล: อัปโหลดรูปพัสดุ</summary>' +
'<p>เลือกไฟล์ ZIP หรือรูปที่ตั้งชื่อตามรหัส เช่น TEF-001.jpg (รูปที่สอง TEF-001_2.jpg) · รูปเดิมของรหัสนั้นจะถูกแทนที่</p>' +
'<input type="file" id="upF" multiple accept=".zip,image/*"> <button class="btn" id="upGo" type="button">เริ่มอัปโหลด</button>' +
'<div class="bar"><i id="upBar"></i></div><div id="upSt" class="kv"></div></details>';
$('upGo').addEventListener('click', bulkUpload);
}
function thumb(blob, max, q){
return new Promise(function (res, rej) {
var u = URL.createObjectURL(blob), im = new Image();
im.onload = function () {
var s = Math.min(1, max / Math.max(im.width, im.height));
var cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(im.width * s)); cv.height = Math.max(1, Math.round(im.height * s));
var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(im, 0, 0, cv.width, cv.height);
URL.revokeObjectURL(u); res(cv.toDataURL('image/jpeg', q));
};
im.onerror = function () { URL.revokeObjectURL(u); rej(new Error('อ่านรูปไม่ได้')); };
im.src = u;
});
}
function fit(blob){
var tries = [[380, .72], [340, .62], [300, .55], [240, .5]], i = 0;
function go(){ return thumb(blob, tries[i][0], tries[i][1]).then(function (d) { if (d.length < 47000 || i >= tries.length - 1) return d; i++; return go(); }); }
return go();
}
var NM = /(?:^|\/)(TEF-\d{3})(?:_(\d+))?\.(?:jpe?g|png|webp)$/i;
function collect(files){
var jobs = [], ps = [];
Array.prototype.forEach.call(files, function (f) {
if (/\.zip$/i.test(f.name)) {
if (typeof JSZip === 'undefined') { jobs.err = 'โหลดตัวแตกไฟล์ ZIP ไม่ได้ (ต้องต่ออินเทอร์เน็ต)'; return; }
ps.push(JSZip.loadAsync(f).then(function (z) {
var ents = []; z.forEach(function (p, e) { if (!e.dir && NM.test(p)) ents.push([p, e]); });
return Promise.all(ents.map(function (x) { return x[1].async('blob').then(function (b) { var m = NM.exec(x[0]); jobs.push({ code: m[1].toUpperCase(), idx: Number(m[2] || 1), name: x[0].split('/').pop(), blob: b }); }); }));
}));
} else {
var m = NM.exec(f.name); if (m) jobs.push({ code: m[1].toUpperCase(), idx: Number(m[2] || 1), name: f.name, blob: f });
}
});
return Promise.all(ps).then(function () { return jobs; });
}
function bulkUpload(){
var fl = $('upF').files; if (!fl.length) { $('upSt').textContent = 'ยังไม่ได้เลือกไฟล์'; return; }
$('upGo').disabled = true; $('upSt').textContent = 'กำลังอ่านไฟล์…';
collect(fl).then(function (jobs) {
if (!jobs.length) { $('upSt').textContent = jobs.err || 'ไม่พบไฟล์ที่ชื่อตรงรูปแบบ TEF-000.jpg'; $('upGo').disabled = false; return; }
jobs.sort(function (a, b) { return a.code < b.code ? -1 : (a.code > b.code ? 1 : a.idx - b.idx); });
var n = jobs.length, done = 0, bad = 0, i = 0;
function next(){
if (i >= n) { $('upSt').textContent = 'เสร็จแล้ว บันทึก ' + (done - bad) + ' รูป' + (bad ? ' ข้าม ' + bad + ' รูป' : '') + ' กำลังโหลดหน้าใหม่…'; setTimeout(function(){ location.reload(); }, 1500); return; }
var grp = jobs.slice(i, i + 4); i += 4;
Promise.all(grp.map(function (j) { return fit(j.blob).then(function (d) { return { code: j.code, idx: j.idx, name: j.name, data: d }; }); })).then(function (b) {
google.script.run.withSuccessHandler(function () { done += grp.length; $('upBar').style.width = Math.round(done / n * 100) + '%'; $('upSt').textContent = done + ' / ' + n; next(); })
.withFailureHandler(function (e) { bad += grp.length; done += grp.length; $('upSt').textContent = 'ผิดพลาด: ' + (e && e.message || e); next(); }).adminSavePhotos(b);
}).catch(function () { bad += grp.length; done += grp.length; next(); });
}
next();
});
}
function twoStep(btn, label, fn){
var orig = btn.textContent, armed = false, tm;
btn.addEventListener('click', function () {
if (!armed) { armed = true; btn.textContent = label; tm = setTimeout(function () { armed = false; btn.textContent = orig; }, 5000); return; }
clearTimeout(tm); armed = false; btn.disabled = true; btn.textContent = 'กำลังทำ…'; fn(btn, orig);
});
}
function uploadOne(code, file, c){
if (!file || !code) return; $('mUpS').textContent = 'กำลังอัปโหลด…';
var cnt = 0; google.script.run.withSuccessHandler(function (arr) {
var idx = (arr || []).length + 1;
fit(file).then(function (d) {
google.script.run.withSuccessHandler(function () { $('mUpS').textContent = 'บันทึกแล้ว รีเฟรชหน้าเพื่อดูรูปใหม่'; delete PH[code]; })
.withFailureHandler(function (e) { $('mUpS').textContent = 'ผิดพลาด: ' + (e && e.message || e); })
.adminSavePhotos([{ code: code, idx: idx, name: file.name, data: d }]);
});
}).stockPhotoSet(code);
}
